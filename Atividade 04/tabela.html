<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table,
        th,
        td {
            border: 1.5px solid rgba(0, 0, 0, 0.199);
            border-collapse: collapse;
            text-align: center;
            padding: 2%;
        }
        .cabecalho {
            background-color: rgb(0, 255, 64)
        }
        .lateral {
            background-color: rgb(0, 119, 255);
        }
    </style>
</head>

<body>
    <table>
        <caption>Trajetória Acadêmica e Profissional</caption>
        <tr class="cabecalho">
            <th rowspan="2" width="30%">Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de Conclusão</th>
        </tr>
        <tr class="cabecalho">
            <th>Graduação</th>
            <th>Pós Graduação</th>
        </tr>
        <tr>
            <th class="lateral">José</th>
            <td>Ciência da Computação</td>
            <td>Inteligência Artificial</td>
            <td>2023</td>
        </tr>
        <tr>
            <th class="lateral">Ana</th>
            <td>Engenharia de Software</td>
            <td>Gestão de Projetos</td>
            <td>2022</td>
        </tr>
        <!--Fórmula para criar tabela rápida-->
        <!--tr*3>td*4-->
    </table>
</body>

</html>
